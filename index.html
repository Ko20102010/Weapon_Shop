<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1d1715"><title>Weapon Shop Empire v0.20.00</title><link rel="stylesheet" href="style.css?v=0.19.00"></head><body>
<div id="slotScreen" class="overlay show firstShopLanding"><div class="slotbox"><h1>WEAPON SHOP EMPIRE</h1><p>v0.20.00 • Woodland Shop Redesign • Auto-save occurs at day end.</p><div id="saveSlots" class="slots"></div></div></div>
<div id="app" class="hidden"><canvas id="game" width="1280" height="720"></canvas>
<div class="hudWrap">
  <div class="topHud"><b id="cash">$250</b><span id="rep">REP 20</span><span id="day">DAY 1</span><span id="clock">OPEN 120s</span><span id="heroHud">⚔️12 🛡️10</span></div>
  <div class="subHud"><span id="carryHud">🤲 Empty (0/3) | 🪙 $0</span><button id="suggest" class="taskBtn">💡 Next Task</button></div>
</div>
<div class="cameraButtons"><button id="zoomIn" title="Zoom In">＋</button><button id="overview" title="Overview">▣</button><button id="zoomOut" title="Zoom Out">−</button></div>
<div id="actionBar" class="actionBar"></div>
<button id="bagToggle" class="bagToggle">🎒 BAG</button><div id="bagPanel" class="bagPanel"></div><div id="mainMenu" class="menuButtons"><button data-page="status">SHOP</button><button data-page="products">CRAFT</button><button data-page="employees">STAFF</button><button data-page="expedition">EXPLORE</button><button data-page="wholesale">MORE</button><button data-page="save">SAVE</button></div>
<div id="panel" class="panel"><button id="closePanel" class="close">×</button><div id="panelContent"></div></div>
<div id="toast" class="toast"></div><div id="dragStick" class="dragStick"><i></i></div>
<div id="tutorial" class="tutorial"><div class="tutorialCard"><div class="tutHead"><b id="tutorialTitle">Welcome</b><button id="tutorialSkip">SKIP</button></div><p id="tutorialText"></p></div></div>
<div id="daySummary" class="daySummary"><div class="summaryBox"><h2>DAY COMPLETE</h2><div id="summaryContent"></div><button id="summaryNext">START NEXT DAY</button></div></div>
<div id="craftGame" class="craftGame"><div class="craftBox"><h2 id="craftTitle">PERSONAL CRAFTING</h2><p>Tap HAMMER when the marker hits the golden center zone!</p><div class="craftTrack"><i id="craftMarker"></i><span></span></div><button id="craftTap">HAMMER!</button></div></div>
<div class="version">Weapon Shop Empire v0.20.00</div>
</div><script src="game.js?v=0.19.00"></script></body></html>
